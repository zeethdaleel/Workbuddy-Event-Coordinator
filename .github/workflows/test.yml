name: Test
on:
  push:
    branches: [main, feat/darlingagent-operations]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node dist/scripts/demo-operations.js artifacts/operations
