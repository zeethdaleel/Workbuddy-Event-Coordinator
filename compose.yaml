services:
  backend:
    build: .
    env_file: .env
    environment:
      DARLING_DATA_DIR: /data
      PORT: 3000
    volumes:
      - darling-data:/data
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DARLING_DATA_DIR: /data
    volumes:
      - darling-data:/data
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
volumes:
  darling-data:
